name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PAYLOAD_SECRET: ci-secret-ci-secret-ci-secret
      DATABASE_URI: file:./data/ci.db
      PUBLIC_URL: http://localhost:3000
      BILDER_DIR: ./data/bilder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrationen und Ende-zu-Ende-Test
        run: |
          mkdir -p data
          npx payload migrate
          npm start &
          npx wait-on -t 60000 http-get://localhost:3000/api/health
          npm run e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reparierbar-backend ./backend
