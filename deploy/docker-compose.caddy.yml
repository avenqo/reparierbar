# Optional: Caddy als Reverse Proxy mit automatischem HTTPS (Let's Encrypt).
# Nur verwenden, wenn auf dem Server die Ports 80 und 443 frei sind.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.caddy.yml up -d --build
services:
  caddy:
    image: caddy:2
    container_name: reparierbar-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt (z. B. repaircafe.kremmener.info)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_daten:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_daten:
  caddy_config:
