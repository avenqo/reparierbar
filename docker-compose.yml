# ReparierBar: Backend (Payload + Next.js) mit SQLite im Volume.
# Konfiguration über .env im selben Ordner (Vorlage: backend/.env.example).
#   docker compose up -d --build
services:
  backend:
    build: ./backend
    container_name: reparierbar-backend
    restart: unless-stopped
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET fehlt (langer Zufallswert)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3100}
      INSTANZ_NAME: ${INSTANZ_NAME:-Repair Café}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-repaircafe@example.org}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - daten:/data # SQLite-Datei (/data/db) und Bilder (/data/bilder)
    ports:
      - "127.0.0.1:${PORT:-3100}:3000" # für den Reverse Proxy auf dem Host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Später: Web-Frontend für Gäste und Reparistas (siehe web/README.md)
  # web:
  #   build: ./web
  #   environment:
  #     API_URL: http://backend:3000/api

volumes:
  daten:
